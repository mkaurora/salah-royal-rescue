<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salah's Islands</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Islands">
<meta name="theme-color" content="#38b6eb">
<meta http-equiv="Cache-Control" content="no-cache">
<style>html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(#7fd3f5,#38b6eb 60%,#1e82c8);color:#fff;text-align:center}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;padding:24px;box-sizing:border-box}
img{width:150px;height:150px;border-radius:34px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
h1{margin:0;font-size:34px;text-shadow:0 3px 0 rgba(0,0,0,.2)}p{margin:0;font-size:20px}
button{font-size:20px;padding:14px 30px;border:0;border-radius:40px;background:#ffd23f;color:#5a3b00;font-weight:700;box-shadow:0 5px 0 #c99a00}</style></head>
<body><main><img src="icons/icon-512.png" alt=""><h1>Salah's Islands</h1>
<p>Coming soon! 🏝️<br>Your new island adventure is being built.</p>
<button onclick="location.reload()">Check again</button></main>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()))}</script>
</body></html>
