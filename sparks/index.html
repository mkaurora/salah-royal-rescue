  <script>
    // Apply saved theme and language before first paint to avoid a flash.
    (function () {
      try {
        var d = document.documentElement;
        var lang = JSON.parse(localStorage.getItem('sparks.lang') || 'null');
        var theme = JSON.parse(localStorage.getItem('sparks.theme') || '"system"');
        if (lang === 'ar') { d.lang = 'ar'; d.dir = 'rtl'; }
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        d.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
</head>
