<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swarm Surge</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1f4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swarm Surge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-top">
        <button id="btn-pause" class="icon-btn" aria-label="Pause">&#10074;&#10074;</button>
        <div class="hud-mid">
          <div id="hud-level">LEVEL 1</div>
          <div id="hud-killwrap">&#9760; <b id="hud-kills">0</b></div>
          <div class="basebar"><i id="hud-basebar"></i><span id="hud-basetxt">0</span></div>
        </div>
        <div id="hud-shield" aria-label="Shield"></div>
      </div>
      <div class="hud-bottom">
        <div class="champ"><div class="champbar"><i id="champ-fill"></i></div>
          <button id="btn-champ" class="champ-btn" disabled>CHAMPION</button></div>
      </div>
      <div id="hint" class="hint hidden">Drag to move &bull; Hold to fire<br>Aim through the gates!</div>
    </div>

    <div id="intro" class="intro hidden"><b id="intro-title">LEVEL 1</b><span id="intro-sub"></span></div>

    <section id="screen-title" class="screen">
      <div class="logo"><span class="l1">SWARM</span><span class="l2">SURGE</span></div>
      <div class="tag">Crowd-cannon battle</div>
      <div class="menu">
        <button id="btn-play" class="btn big green">PLAY <small id="play-sub">Level 1</small></button>
        <button id="btn-levels" class="btn blue">Levels</button>
        <button id="btn-upgrades" class="btn orange">Upgrades</button>
        <button id="btn-settings" class="btn gray">Settings</button>
      </div>
      <div class="coinline"><span class="coin"></span><b id="title-coins">0</b> &nbsp; <span class="star on">&#9733;</span><b id="title-stars">0</b></div>
    </section>

    <section id="screen-levels" class="screen hidden">
      <header class="bar"><button class="icon-btn back" data-back>&#8592;</button><h2>Levels</h2><div class="coinline"><span class="coin"></span><b class="coins-val">0</b></div></header>
      <div id="levelgrid" class="levelgrid"></div>
    </section>

    <section id="screen-upgrades" class="screen hidden">
      <header class="bar"><button class="icon-btn back" data-back>&#8592;</button><h2>Upgrades</h2><div class="coinline"><span class="coin"></span><b class="coins-val">0</b></div></header>
      <div class="scroll">
        <div id="uplist"></div>
        <h3>Cannon Skins</h3>
        <div id="skinlist" class="skinlist"></div>
      </div>
    </section>

    <section id="screen-settings" class="screen hidden">
      <header class="bar"><button class="icon-btn back" data-back>&#8592;</button><h2>Settings</h2><div></div></header>
      <div class="scroll settings">
        <button id="set-sound" class="toggle"><span>Sound</span><b>ON</b></button>
        <button id="set-vibe" class="toggle"><span>Vibration</span><b>ON</b></button>
        <button id="btn-update" class="btn blue">Check for update</button>
        <div id="update-status" class="small"></div>
        <button id="btn-reset" class="btn red">Reset progress</button>
        <div id="version" class="small version"></div>
      </div>
    </section>

    <section id="screen-pause" class="screen overlay hidden">
      <div class="panel">
        <h2>Paused</h2>
        <button id="btn-resume" class="btn big green">Resume</button>
        <button id="btn-restart" class="btn blue">Restart</button>
        <button id="btn-quit" class="btn gray">Quit to menu</button>
      </div>
    </section>

    <section id="screen-result" class="screen overlay hidden">
      <div class="panel result">
        <h2 id="res-title">VICTORY!</h2>
        <div id="res-stars" class="stars"><i>&#9733;</i><i>&#9733;</i><i>&#9733;</i></div>
        <div class="res-line"><span class="coin"></span><b id="res-coins">+0</b></div>
        <div id="res-info" class="small"></div>
        <button id="btn-next" class="btn big green">Next level</button>
        <button id="btn-retry" class="btn blue">Retry</button>
        <button id="btn-menu" class="btn gray">Levels</button>
      </div>
    </section>

    <section id="screen-confirm" class="screen overlay hidden">
      <div class="panel">
        <h2>Reset progress?</h2>
        <p class="small">All stars, coins, upgrades and skins will be erased.</p>
        <button id="btn-confirm-yes" class="btn red">Yes, erase</button>
        <button id="btn-confirm-no" class="btn gray">Cancel</button>
      </div>
    </section>

    <div id="update-banner" class="update-banner hidden" role="button" tabindex="0">New version! Tap to update</div>
    <div id="toast" class="toast hidden"></div>
  </div>
</div>
<script src="js/version.js"></script>
<script src="js/data/levels.js"></script>
<script src="js/core/updater.js"></script>
<script src="js/core/save.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/game/sim.js"></script>
<script src="js/game/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
