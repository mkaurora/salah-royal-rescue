<style>

.scr{position:fixed;inset:0;display:none;overflow:hidden}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:64px;min-width:64px;border:0;border-radius:24px;padding:10px 26px;
 font-size:26px;font-weight:900;color:#fff;background:linear-gradient(#9ef56a,#46c524 52%,#2e9e14);box-shadow:0 6px 0 #1d6e0c,0 12px 20px #0005,inset 0 -3px 0 #0002;
 text-shadow:0 2px 0 #1d6e0c;transition:transform .08s,box-shadow .08s;overflow:hidden}
.btn::before{content:'';position:absolute;left:8%;right:8%;top:4px;height:42%;border-radius:20px 20px 40% 40%;background:linear-gradient(#fffc,#fff1);pointer-events:none}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #1d6e0c,0 4px 8px #0005}

.btn.blue{background:linear-gradient(#7cc8ff,#2f86f0 52%,#1e60c9);box-shadow:0 6px 0 #133f8c,0 12px 20px #0005;text-shadow:0 2px 0 #133f8c}
.btn.gold{background:linear-gradient(#ffe27a,#ffbf1f 52%,#f09a00);box-shadow:0 6px 0 #a35f00,0 12px 20px #0005;text-shadow:0 2px 0 #a35f00}
.btn.red{background:linear-gradient(#ff9a8a,#f2483a 52%,#cc2a1d);box-shadow:0 6px 0 #8a170e,0 12px 20px #0005;text-shadow:0 2px 0 #8a170e}
.btn.purple{background:linear-gradient(#d3a2ff,#9a52f0 52%,#7a33d0);box-shadow:0 6px 0 #4f1a92,0 12px 20px #0005;text-shadow:0 2px 0 #4f1a92}
.btn.round{width:58px;height:58px;min-height:58px;min-width:58px;padding:0;border-radius:50%;font-size:26px}
.btn.big{font-size:34px;min-height:84px;padding:12px 44px;border-radius:30px}
.btn.wide{width:100%}
/* ---------- panels ---------- */
.panel{position:relative;background:linear-gradient(#5fb6ff,#2b74e6 40%,#2056c4);border:4px solid #ffe08a;border-radius:30px;
 box-shadow:0 0 0 4px #b67a10,0 16px 40px #0009,inset 0 4px 0 #fff6,inset 0 -6px 0 #0002;padding:20px}
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(#0a1d4dcc,#030a20ee);padding:calc(var(--st) + 10px) 14px calc(var(--sb) + 10px)}

#logo{text-align:center;animation:bob 3s ease-in-out infinite}

.demo{position:relative;margin:10px auto 6px;border-radius:18px;background:linear-gradient(#173f9a,#0e2a6e);box-shadow:inset 0 3px 10px #000a,0 0 0 4px #f6c443;overflow:hidden}

<script id="logic">
"use strict";
// ================= PURE GAME LOGIC (no DOM) — unit-tested by tests/tests.js =================
var N=8,uid=1;
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
const NCOL=6,SPECIALS=['rocketH','rocketV','bomb','water'];
function nid(){return uid++}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function isTile(t){return !!t&&!t.fixed}
function isGem(t){return !!t&&!t.fixed&&typeof t.type==='number'&&t.type>=0}
function isSpecial(t){return isTile(t)&&!!t.sp}
function swapCells(b,r,c,r2,c2){const t=b[r][c];b[r][c]=b[r2][c2];b[r2][c2]=t}
function cloneBoard(b){return b.map(row=>row.map(t=>t?Object.assign({},t):null))}
function emptyBoard(R,C){const b=[];for(let r=0;r<(R||N);r++)b.push(new Array(C||N).fill(null));return b}

// All maximal straight runs of 3+ same-colour gems. Returns [{dir:'h'|'v',type,cells:[[r,c],...]}]
function findMatches(b){
  const runs=[],R=b.length,C=R?b[0].length:0;
  for(let r=0;r<R;r++){let c=0;
    while(c<C){const t=b[r][c];if(!isGem(t)){c++;continue}
      let e=c+1;while(e<C&&isGem(b[r][e])&&b[r][e].type===t.type)e++;
      if(e-c>=3){const cells=[];for(let i=c;i<e;i++)cells.push([r,i]);runs.push({dir:'h',type:t.type,cells})}
      c=e}}
  for(let c=0;c<C;c++){let r=0;
    while(r<R){const t=b[r][c];if(!isGem(t)){r++;continue}
      let e=r+1;while(e<R&&isGem(b[e][c])&&b[e][c].type===t.type)e++;
      if(e-r>=3){const cells=[];for(let i=r;i<e;i++)cells.push([i,c]);runs.push({dir:'v',type:t.type,cells})}
      r=e}}
  return runs;
}
// Merge runs that share a cell (L, T, + shapes) into groups.
function groupRuns(runs){
  const p=runs.map((_,i)=>i),f=i=>p[i]===i?i:(p[i]=f(p[i])),owner=new Map();
  runs.forEach((ru,i)=>ru.cells.forEach(([r,c])=>{const k=r+','+c;if(owner.has(k))p[f(i)]=f(owner.get(k));else owner.set(k,i)}));
  const gm=new Map();

}

function migrateV1(raw){

    if(Array.isArray(d))k=d.filter(Boolean).length;

  }catch(e){return 0}

}

  const s=freshSave();if(!o||typeof o!=='object'||Array.isArray(o))return s;
  const intIn=(v,lo,hi)=>{v=Number(v);return Number.isFinite(v)?Math.max(lo,Math.min(hi,Math.floor(v))):null};
  if(o.done&&typeof o.done==='object')for(const k of Object.keys(o.done)){const i=Number(k),v=intIn(o.done[k],0,3);if(Number.isInteger(i)&&i>=0&&i<LEVELS.length&&v)s.done[i]=v}

function loadSave(get){

}
function cleanCell(t){
  if(!t||typeof t!=='object')return null;
  if(t.fixed==='fire')return {id:nid(),fixed:'fire'};
  if(t.fixed==='box')return {id:nid(),fixed:'box',hp:t.hp===2?2:1};
  if(t.fixed)return null;
  if(t.sp==='water')return {id:nid(),type:-1,sp:'water'};
  if(!Number.isInteger(t.type)||t.type<0||t.type>=NCOL)return null;
  const o={id:nid(),type:t.type};
  if(t.sp==='rocketH'||t.sp==='rocketV'||t.sp==='bomb')o.sp=t.sp;else if(t.sp)return null;

}
// Validate a saved in-progress level. Returns a clean copy or null.
function validateCur(cur){
  try{

    const mode=cur.mode;if(mode!=='story'&&mode!=='endless')return null;
    if(mode==='story'&&!(Number.isInteger(cur.lv)&&cur.lv>=0&&cur.lv<LEVELS.length))return null;
    if(mode==='endless'&&!(Number.isInteger(cur.en)&&cur.en>=1&&cur.en<=1e6))return null;
    if(!Array.isArray(cur.b)||cur.b.length!==N)return null;
    const b=[];

    const isI=(v,lo,hi)=>Number.isInteger(v)&&v>=lo&&v<=hi;

  }catch(e){return null}
}

  boardX=Math.round((W-B)/2);boardY=Math.round(H-si.b-12-7-B);
  Object.assign($('frame').style,{left:boardX-7+'px',top:boardY-7+'px',width:B+14+'px',height:B+14+'px'});
  const cv=$('board');Object.assign(cv.style,{left:boardX-pad+'px',top:boardY-pad+'px',width:B+2*pad+'px',height:B+2*pad+'px'});

  const sceneTop=hudB+62,sceneBot=boardY-12,sh=Math.max(60,sceneBot-sceneTop);

  const bub=$('bubble'),short=sh<200;Object.assign(bub.style,{left:salW+20+'px',bottom:(H-sceneBot)+(short?6:salH*.42)+'px',maxWidth:Math.min(300,W-salW-34)+'px',fontSize:short?'14px':''});

  if(!g||!g.b||!$('game').classList.contains('on')||!IMG)return;
  updateSprites(dt,now);draw(now,dt);
  if(!g.busy&&!g.over&&now-lastAct>6000){if(hintBoard!==g.turn){hint=findHint(g.b);hintBoard=g.turn}}else if(g.busy)hint=null;
}
function easeIO(k){return k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2}
function updateSprites(dt,now){
  const seen=new Set();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=g.b[r][c];if(!t)continue;seen.add(t.id);let s=spr.get(t.id);
    if(!s){s={x:c,y:r-(t.fromAbove||0),vy:0,sc:t.spawn?0:1,land:0,tw:null};delete t.fromAbove;delete t.spawn;spr.set(t.id,s)}
    if(s.tw){const k=Math.min(1,(now-s.tw.t0)/s.tw.d),e=s.tw.back?Math.sin(Math.PI*k):easeIO(k);
      s.x=s.tw.fx+(s.tw.tx-s.tw.fx)*e;s.y=s.tw.fy+(s.tw.ty-s.tw.fy)*e;if(k>=1){s.tw=null;if(s.tw===null&&!0){}}}
    if(!s.tw){
      if(s.y<r){s.vy=Math.min(s.vy+60*dt,18);s.y+=s.vy*dt;if(s.y>=r){s.y=r;if(s.vy>3)s.land=now;s.vy=0}}
      else if(s.y>r){s.y=Math.max(r,s.y-Math.max(.02,(s.y-r)*Math.min(1,dt*14)))}
      if(s.x!==c){const d=c-s.x;s.x=Math.abs(d)<.02?c:s.x+d*Math.min(1,dt*14)}}
    if(s.sc<1)s.sc=Math.min(1,s.sc+dt*5)}
  for(const id of spr.keys())if(!seen.has(id))spr.delete(id);
}
function settled(){if(!g)return true;for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=g.b[r][c];if(!t)continue;const s=spr.get(t.id);if(!s||s.tw||s.y!==r||s.x!==c||s.sc<1)return false}return true}
async function settle(max){const t0=performance.now();await wait(40);while(performance.now()-t0<max&&!settled())await wait(16)}
function drawTile(t,px,py,size,now,s){
  const x=ctx;
  if(t.fixed==='fire'){drawFire(x,px+size/2,py+size/2,size,now,t.id%9);return}
  if(t.fixed==='box'){x.drawImage(IMG.box[t.hp>=2?2:1],px,py,size,size);return}
  if(t.sp==='water'){const bob=Math.sin(now/280+t.id)*size*.035;x.drawImage(IMG.water,px,py+bob,size,size);return}
  if(t.sp==='rocketH'||t.sp==='rocketV'){const w=Math.sin(now/90+t.id)*size*.03;x.drawImage((t.sp==='rocketH'?IMG.rH:IMG.rV)[t.type],px+(t.sp==='rocketH'?w:0),py+(t.sp==='rocketV'?w:0),size,size);return}
  if(t.sp==='bomb'){x.drawImage(IMG.bomb[t.type],px,py,size,size);const fl=.6+.4*Math.sin(now/40+t.id);
    const gx=px+size*.72,gy=py+size*.1,gr=x.createRadialGradient(gx,gy,0,gx,gy,size*.16*fl);gr.addColorStop(0,'#fff');gr.addColorStop(.3,'#ffe14a');gr.addColorStop(1,'rgba(255,120,0,0)');
    x.fillStyle=gr;x.beginPath();x.arc(gx,gy,size*.16*fl,0,7);x.fill();return}
  if(t.type>=0)x.drawImage(IMG.gem[t.type],px,py,size,size);
}
function draw(now,dt){
  const x=ctx;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,$('board').width,$('board').height);

  x.drawImage(cellBg,0,0,B,B);
  x.save();x.beginPath();x.rect(-2,0,B+4,B+pad);x.clip();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=g.b[r][c];if(!t)continue;const s=spr.get(t.id);if(!s)continue;
    let size=cs*s.sc,ox=0,oy=0,sxx=1,syy=1,rot=0;

    if(hint&&!g.busy&&((hint[0]===r&&hint[1]===c)||(hint[2]===r&&hint[3]===c)))rot=Math.sin(now/70)*.12*(Math.sin(now/600)>0?1:0);

    x.save();x.translate(cx,cy+(syy<1?cs*(1-syy)/2:0));if(rot)x.rotate(rot);x.scale(sxx,syy);drawTile(t,-size/2+ox,-size/2+oy,size,now,s);x.restore()}

    else if(p.kind==='drop'){x.beginPath();x.arc(0,0,p.sz,0,7);x.fill();x.fillStyle='rgba(255,255,255,.7)';x.beginPath();x.arc(-p.sz*.3,-p.sz*.3,p.sz*.3,0,7);x.fill()}

    x.translate(p.x,p.y-k*cs*.8);x.scale(sc,sc);x.font=`900 ${Math.round(cs*.45)}px ui-rounded,system-ui,sans-serif`;x.textAlign='center';x.textBaseline='middle';
    x.lineWidth=cs*.1;x.strokeStyle='#0d2f7a';x.strokeText(p.text,0,0);x.fillStyle=p.col||'#fff';x.fillText(p.text,0,0);x.restore();return true});
}
function drawFx(f,k,now){const x=ctx;
  if(f.kind==='beam'){const cx=f.c*cs+cs/2,cy=f.r*cs+cs/2,dist=k*B*1.1,img=f.dir==='h'?IMG.rH[f.type>=0?f.type:3]:IMG.rV[f.type>=0?f.type:3];

    if(f.dir==='h'){x.fillRect(cx-dist,cy-w/2,dist*2,w)}else x.fillRect(cx-w/2,cy-dist,w,dist*2);x.restore();
    for(const sgn of [1,-1]){x.save();if(f.dir==='h')x.translate(cx+sgn*dist,cy);else x.translate(cx,cy+sgn*dist);
      if(f.dir==='h'&&sgn<0)x.scale(-1,1);if(f.dir==='v'&&sgn>0)x.scale(1,-1);x.drawImage(img,-cs/2,-cs/2,cs,cs);x.restore()}
    if(Math.random()<.7)for(const sgn of [1,-1])addP(f.dir==='h'?cx+sgn*dist:cx,f.dir==='h'?cy:cy+sgn*dist,'spark','#ffe680',cs*.12,.4,0);}
  else if(f.kind==='ring'){const r=f.r0+(f.r1-f.r0)*easeIO(k);x.save();x.globalAlpha=1-k;x.lineWidth=cs*.25*(1-k)+2;x.strokeStyle=f.col;x.beginPath();x.arc(f.x,f.y,r,0,7);x.stroke();
    if(f.fill){x.globalAlpha=(1-k)*.5;x.fillStyle=f.fill;x.fill()}x.restore()}
  else if(f.kind==='flash'){x.save();x.globalAlpha=(1-k)*.6;x.fillStyle=f.col||'#fff';x.fillRect(-pad,-pad,B+2*pad,B+2*pad);x.restore()}
}
function addP(x,y,kind,col,sz,life,speed,grav){if(parts.length>600)return;const a=Math.random()*Math.PI*2,sp=(speed==null?1:speed)*cs*(2+Math.random()*4);
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(kind==='smoke'?cs*1.5:0),g:grav!=null?grav:(kind==='smoke'?-cs*.5:cs*14),t:0,life:life||.6,col,sz:sz||cs*.1,kind,rot:Math.random()*6,vr:(Math.random()-.5)*12})}

  if(d.kind==='fire'){for(let i=0;i<9;i++)addP(cx,cy,'smoke',i%2?'#c8d0dc':'#ffffff',cs*.12,.9,.3);for(let i=0;i<5;i++)addP(cx,cy,'drop','#5fd0ff',cs*.06,.5,.8);return}

  if(d.kind==='merge')return;

// ---------- moves ----------
function tween(t,fr,fc,tr,tc,d,back){const s=spr.get(t.id);if(!s)return;s.tw={fx:fc,fy:fr,tx:tc,ty:tr,t0:performance.now(),d:d||170,back:!!back};if(!back){s.x=fc;s.y=fr}}
async function tryMove(r1,c1,r2,c2){
  if(!g||!g.b||g.busy||g.over)return false;
  if(r1===r2&&c1===c2)return activateTap(r1,c1);
  if(![r1,c1,r2,c2].every(v=>Number.isInteger(v)&&v>=0&&v<N)||Math.abs(r1-r2)+Math.abs(c1-c2)!==1)return false;
  const a=g.b[r1][c1],t=g.b[r2][c2];if(!isTile(a)||!isTile(t))return false;
  g.busy=true;sel=null;hint=null;lastAct=performance.now();
  const plan=planMove(g.b,r1,c1,r2,c2);
  if(!plan){tween(a,r1,c1,r2,c2,300,true);tween(t,r2,c2,r1,c1,300,true);sfx.bad();await wait(320);g.busy=false;return false}
  tween(a,r1,c1,r2,c2,170);tween(t,r2,c2,r1,c1,170);sfx.swap();await wait(180);
  g.moves--;hud();
  try{const tot=await runResolve(plan);await endTurn(tot)}catch(e){console.error(e);g.busy=false}
  return true;
}
async function activateTap(r,c){
  if(!g||g.busy||g.over||!g.b[r]||!isSpecial(g.b[r][c]))return false;
  g.busy=true;sel=null;hint=null;lastAct=performance.now();g.moves--;hud();
  try{const tot=await runResolve(planTap(g.b,r,c));await endTurn(tot)}catch(e){console.error(e);g.busy=false}
  return true;
}
async function runResolve(first){
  let o=Object.assign({},first,{mult:1}),step=0;const tot={fireOut:0,steps:0};
  while(step<200){
    const ev=resolveStep(g.b,o);if(!ev.any)break;step++;
    const dly=showEvents(ev,step);tot.fireOut+=ev.fireOut;
    g.score+=ev.score;for(const k in ev.collected)g.collected[k]=(g.collected[k]||0)+ev.collected[k];hud();
    await wait(220+dly);
    applyGravity(g.b,genTile);await settle(700);o={mult:step+1};
  }
  tot.steps=step;if(step>=2)comboShow(step);return tot;
}
function showEvents(ev,step){
  const now=performance.now();let maxD=0;
  const merged=new Map();ev.created.forEach(cr=>cr.from.forEach(([r,c])=>merged.set(r+','+c,cr)));
  const inMatch=new Set();ev.groups.forEach(gr=>gr.cells.forEach(([r,c])=>inMatch.add(r+','+c)));
  const bl=ev.blasts;
  const dist=(r,c)=>{let m=99;for(const b2 of bl)m=Math.min(m,Math.max(Math.abs(b2.r-r),Math.abs(b2.c-c)));return m===99?0:m};
  for(const e of ev.cleared){const s=spr.get(e.t.id),k=e.r+','+e.c,cr=merged.get(k);
    const delay=inMatch.has(k)?0:Math.min(400,dist(e.r,e.c)*45);maxD=Math.max(maxD,delay);
    dying.push({t:e.t,x:s?s.x:e.c,y:s?s.y:e.r,t0:now,delay,dur:cr?200:260,kind:cr?'merge':'pop',tx:cr?cr.c:0,ty:cr?cr.r:0})}
  for(const h of ev.hits){const delay=Math.min(400,dist(h.r,h.c)*45);
    if(h.gone)dying.push({t:h.t,x:h.c,y:h.r,t0:now,delay,dur:h.t.fixed==='fire'?380:300,kind:h.t.fixed==='fire'?'fire':'pop'});
    else for(let i=0;i<8;i++)addP(h.c*cs+cs/2,h.r*cs+cs/2,'wood',i%2?'#c98a48':'#e8eef5',cs*.08,.6,1)}
  for(const b2 of bl){const cx=b2.c*cs+cs/2,cy=b2.r*cs+cs/2,ty=b2.type!=null?b2.type:3;
    if(b2.kind==='rocketH'||b2.kind==='rocketV'){fxs.push({kind:'beam',r:b2.r,c:b2.c,dir:b2.kind==='rocketH'?'h':'v',type:ty,t0:now,d:420});sfx.rocket()}
    else if(b2.kind==='cross'){[-0,].forEach(()=>{});fxs.push({kind:'beam',r:b2.r,c:b2.c,dir:'h',type:ty,t0:now,d:420},{kind:'beam',r:b2.r,c:b2.c,dir:'v',type:ty,t0:now,d:420});sfx.rocket();shake(8)}
    else if(b2.kind==='bigcross'){for(let d=-1;d<=1;d++)fxs.push({kind:'beam',r:b2.r+d,c:b2.c,dir:'h',type:ty,t0:now,d:450},{kind:'beam',r:b2.r,c:b2.c+d,dir:'v',type:ty,t0:now,d:450});sfx.rocket();sfx.bomb();shake(14)}
    else if(b2.kind==='bomb'||b2.kind==='bigbomb'){const big=b2.kind==='bigbomb';fxs.push({kind:'ring',x:cx,y:cy,r0:cs*.3,r1:cs*(big?4:2.8),col:'#ffd21e',fill:'#fff3b0',t0:now,d:450},{kind:'flash',col:'#fff6d0',t0:now,d:220});
      for(let i=0;i<(big?40:22);i++)addP(cx,cy,i%2?'spark':'shard',i%3?'#ffb300':'#ff5a1a',cs*.14,.8,1.6);sfx.bomb();shake(big?18:11)}
    else if(b2.kind==='water'||b2.kind==='rain'){const rain=b2.kind==='rain';fxs.push({kind:'ring',x:cx,y:cy,r0:cs*.3,r1:cs*(rain?8:2.6),col:'#7fe0ff',fill:'#bff0ff',t0:now,d:500});
      for(let i=0;i<(rain?60:24);i++)addP(rain?Math.random()*B:cx,rain?Math.random()*B*.5:cy,'drop',i%2?'#5fd0ff':'#bff0ff',cs*.08,.8,rain?.4:1.3);sfx.splash()}
    if(b2.water&&b2.kind!=='rain'){fxs.push({kind:'ring',x:cx,y:cy,r0:cs*.3,r1:cs*3.5,col:'#7fe0ff',fill:'#bff0ff',t0:now,d:500});sfx.splash()}}
  if(ev.created.length){sfx.special();const sp=ev.created[0].t.sp;
    if(!bl.length)say(sp==='bomb'?'You made a BOMB! 💣 Tap it twice!':'You made a ROCKET! 🚀 Tap it twice!',sp==='bomb'?'صنعت قنبلة!':'صنعت صاروخًا!',2600);
    for(const cr of ev.created)fxs.push({kind:'ring',x:cr.c*cs+cs/2,y:cr.r*cs+cs/2,r0:cs*.2,r1:cs*.9,col:'#fff',t0:now+180,d:300})}
  if(ev.fireOut){sfx.out();if(ev.fireOut>=1)say(pick([['Fire out! Great job! 💧','أطفأت النار!'],['Psssh! No more fire there!','أحسنت!'],['You are a fire hero!','بطل الإطفاء!']])[0],null,2000)}
  if(ev.boxOut)sfx.box();
  if(ev.cleared.length)sfx.match(step-1);
  if(ev.cleared.length){let sx=0,sy=0;ev.cleared.forEach(e=>{sx+=e.c;sy+=e.r});pops.push({x:(sx/ev.cleared.length)*cs+cs/2,y:(sy/ev.cleared.length)*cs+cs/2,text:'+'+ev.score,t0:now+100,col:step>1?'#ffe14a':'#fff'})}
  return maxD;
}
const COMBO=[null,null,['Good!','جيد!'],['Great!','رائع!'],['Awesome!','مذهل!'],['AMAZING!','خيالي!']];
function comboShow(n){const w=COMBO[Math.min(5,n)];const e=$('combo');e.innerHTML=`${w[0]}<span class="ar">${w[1]}</span>`;e.classList.remove('show');void e.offsetWidth;e.classList.add('show');

async function endTurn(tot){
  g.turn++;
  if(levelWon(g.L.goals,status())){hud();return win()}
  const fires=countFixed(g.b).fire;
  if(fires>0&&!tot.fireOut){let spread=0;
    for(let i=0;i<(g.L.spread||1);i++){const o=spreadFire(g.b);if(!o)break;spread++;
      const s=spr.get(o.old.id);dying.push({t:o.old,x:o.c,y:o.r,t0:performance.now(),delay:0,dur:350,kind:'burn'});
      for(let j=0;j<8;j++)addP(o.c*cs+cs/2,o.r*cs+cs/2,'spark',j%2?'#ffb300':'#ff5a1a',cs*.1,.5,.8);
      const nt=g.b[o.r][o.c];spr.set(nt.id,{x:o.c,y:o.r,vy:0,sc:0,land:0,tw:null});void s}
    if(spread){sfx.fire();hud();if(g.turn<3||Math.random()<.5)say('Oh no, the fire grew! 🔥 Match next to it!','النار كبرت! طابق بجانبها',2600);salahMood('wow',1200);await wait(380)}}
  if(g.moves<=0){hud();return lose('Out of moves!')}
  if(!hasMove(g.b)){toast('No moves left — shuffle! 🔀');shuffleBoard(g.b,Math.random,g.L.colors);
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=g.b[r][c],s=t&&spr.get(t.id);if(s&&isTile(t))s.tw={fx:s.x,fy:s.y,tx:c,ty:r,t0:performance.now(),d:450}}
    await wait(500);if(!hasMove(g.b)){return lose('The fire got too big!')}}
  if(g.moves===5)say('Only 5 moves left! You can do it!','بقيت ٥ حركات!',2600);
  hud();saveCur();g.busy=false;lastAct=performance.now();
}

// ---------- win / lose ----------
function win(){
  if(!g||g.over)return;g.over=true;g.busy=true;sel=null;
  const left=Math.max(0,g.moves),stars=starsFor(left,g.L.moves),bonus=left*100;g.score+=bonus;
  save.cur=null;
  if(g.mode==='story'){save.done[g.lv]=Math.max(save.done[g.lv]||0,stars);save.best[g.lv]=Math.max(save.best[g.lv]||0,g.score)}
  else{save.endless.lv=g.en+1;save.endless.best=Math.max(save.endless.best||0,g.en)}
  persist();hud();
  salahMood('cheer');sfx.win();say(pick([['WE DID IT!','نجحنا!'],['Hooray! You are amazing!','رائع جدًا!'],['Yes! Best player ever!','أفضل لاعب!']])[0],null,3000);
  confetti(2600);
  setTimeout(()=>showWin(stars,bonus),700);
}
function showWin(stars,bonus){
  if(!g)return;const story=g.mode==='story',last=story&&g.lv===LEVELS.length-1,city=cityOf();
  const nextCity=story&&!last?CITIES[LEVELS[g.lv+1].city]:null,newCity=nextCity&&nextCity!==city;
  openOv(`<div class="panel" style="margin-top:40px"><div class="ribbon ttl">${last?'Journey Complete!':'Level Complete!'}<span class="ar">أحسنت!</span></div>
   <div class="stars3">${[0,1,2].map(i=>starSVG(i<stars)).join('')}</div>
   <div class="score ttl">Score ${g.score}</div>${bonus?`<p style="font-size:16px;margin:2px">+${bonus} bonus for ${bonus/100} moves left!</p>`:''}
   <p>${pick(['You are a super hero, Salah!','Wow! So smart!','Fantastic matching!','Great job, champion!'])}</p>
   ${newCity?`<div class="fact">Next stop: <b>${nextCity.en}</b> <span class="ar">${nextCity.ar}</span> (${COUNTRY[nextCity.c].en})</div>`:''}
   ${last?'<div class="fact">You visited every city! 🎉 Endless mode is now open: how far can you go?</div>':''}
   <button class="btn big wide" id="wNext">${last?'Play Endless ∞':'Next ▶'}<small class="ar">${last?'بلا نهاية':'التالي'}</small></button>
   <div class="btnRow"><button class="btn blue" id="wMap">Map<small class="ar">الخريطة</small></button><button class="btn gold" id="wAgain">Replay<small class="ar">أعد</small></button></div></div>`);
  $('ov').querySelectorAll('.stars3 svg').forEach((s,i)=>setTimeout(()=>{s.classList.add('in');if(i<stars)sfx.star(i)},250+i*300));
  $('wNext').onclick=()=>{sfx.click();if(g.mode==='endless')startEndless(g.en+1);else if(last)startEndless(save.endless.lv||1);else start(g.lv+1)};
  $('wMap').onclick=()=>{sfx.click();openMap()};
  $('wAgain').onclick=()=>{sfx.click();if(g.mode==='endless')startEndless(g.en);else start(g.lv)};

function lose(why){
  if(!g||g.over)return;g.over=true;g.busy=true;sel=null;save.cur=null;
  const endless=g.mode==='endless',canPlus=!g.plus&&g.moves<=0;
  if(endless){save.endless.best=Math.max(save.endless.best||0,g.en-1)}
  persist();sfx.lose();salahMood('sad');
  setTimeout(()=>{openOv(`<div class="panel" style="margin-top:40px"><div class="ribbon ttl" style="background:linear-gradient(#7cc8ff,#1e60c9);box-shadow:0 5px 0 #133f8c">${why}<span class="ar">${why.startsWith('Out')?'انتهت الحركات':'النار كبرت جدًا'}</span></div>
    <div id="lSalah" style="width:110px;margin:0 auto">${salahSVG('sad')}</div>
    <p>So close! Don't give up — Salah believes in you!</p>${endless?`<p style="font-size:17px">Your run reached Endless level ${g.en}. Best: ${save.endless.best}</p>`:''}
    ${canPlus?`<button class="btn gold big wide" id="lPlus">+5 Moves<small class="ar">+٥ حركات</small></button>`:''}
    <div class="btnRow"><button class="btn ${canPlus?'':'big'}" id="lAgain">${endless?'New run':'Try again'}<small class="ar">حاول مرة أخرى</small></button><button class="btn blue" id="lMap">Map<small class="ar">الخريطة</small></button></div></div>`);
    if(canPlus)$('lPlus').onclick=()=>{sfx.click();g.plus=1;g.moves+=5;g.over=false;g.busy=false;closeOv();salahMood('happy');hud();saveCur();say('5 more moves! Go go go!','٥ حركات إضافية!',2500)};
    $('lAgain').onclick=()=>{sfx.click();if(endless){save.endless.lv=1;persist();startEndless(1)}else start(g.lv)};
    $('lMap').onclick=()=>{sfx.click();if(endless){save.endless.lv=1;persist()}openMap()};

// ---------- confetti ----------
let conf=[],confOn=false;
function confetti(ms){const cv=$('fx'),W=innerWidth,H=innerHeight,d=Math.min(2,window.devicePixelRatio||1);cv.width=W*d;cv.height=H*d;
  const cols=['#ff4a6a','#ffd21e','#2fc23a','#1f8cff','#a64bf0','#ff8a1e','#fff'];
  for(let i=0;i<160;i++)conf.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*900,vy:-Math.random()*900-200,r:Math.random()*6,vr:(Math.random()-.5)*14,w:6+Math.random()*7,h:4+Math.random()*5,c:pick(cols),t:0,life:ms/1000+Math.random()});
  if(!confOn){confOn=true;let lt=performance.now();const step=now=>{const dt=Math.min(.05,(now-lt)/1000);lt=now;const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,H);
    conf=conf.filter(p=>{p.t+=dt;p.vy+=900*dt;p.vx*=.985;p.vy*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;if(p.t>p.life||p.y>H+20)return false;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,Math.cos(p.t*8));x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();return true});
    if(conf.length)requestAnimationFrame(step);else{confOn=false;x.clearRect(0,0,W,H)}};requestAnimationFrame(step)}}

let touch=null;
function cellAt(e){const r0=$('board').getBoundingClientRect();const x=e.clientX-r0.left-pad,y=e.clientY-r0.top-pad;const c=Math.floor(x/cs),r=Math.floor(y/cs);return r>=0&&r<N&&c>=0&&c<N?[r,c]:null}
$('board').addEventListener('pointerdown',e=>{e.preventDefault();if(!g||g.busy||g.over)return;const rc=cellAt(e);if(!rc)return;touch={rc,x:e.clientX,y:e.clientY,done:false,id:e.pointerId};try{$('board').setPointerCapture(e.pointerId)}catch(_){}});
$('board').addEventListener('pointermove',e=>{if(!touch||touch.done||!g||g.busy)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))<cs*.3)return;
  touch.done=true;const [r,c]=touch.rc,[r2,c2]=Math.abs(dx)>Math.abs(dy)?[r,c+Math.sign(dx)]:[r+Math.sign(dy),c];sel=null;if(r2>=0&&r2<N&&c2>=0&&c2<N)tryMove(r,c,r2,c2)});
$('board').addEventListener('pointerup',e=>{if(!touch||touch.done||!g||g.busy){touch=null;return}const [r,c]=touch.rc;touch=null;lastAct=performance.now();
  const t=g.b[r][c];
  if(sel){const [sr,sc]=sel;sel=null;
    if(sr===r&&sc===c){if(isSpecial(t))activateTap(r,c);return}
    if(Math.abs(sr-r)+Math.abs(sc-c)===1){tryMove(sr,sc,r,c);return}}
  if(isTile(t)){sel=[r,c];sfx.click();if(isSpecial(t))say(t.sp==='water'?'Tap again to SPLASH! 💧':'Tap again to use it!',null,1600)}
  else if(t&&t.fixed==='fire')say('That is fire! Match next to it to put it out.','طابق بجانب النار',2200);
  else if(t&&t.fixed==='box')say('A crate! Match next to it to break it.','اكسر الصندوق',2000)});
$('board').addEventListener('pointercancel',()=>{touch=null});

// small animated demo built from DOM sprites
function makeDemo(host,cols,rows,cell){
  const el=document.createElement('div');el.className='demo';el.style.width=cols*cell+'px';el.style.height=rows*cell+'px';host.appendChild(el);
  const tiles={};const hand=document.createElement('div');hand.className='hand';hand.innerHTML=handSVG();hand.style.opacity=0;el.appendChild(hand);
  const pos=(e,c,r,sc)=>{e.style.transform=`translate(${c*cell}px,${r*cell}px) scale(${sc==null?1:sc})`};
  const D={cell,
    clear(){for(const k in tiles){tiles[k].remove();delete tiles[k]}hand.style.opacity=0},
    put(k,c,r,ic){const e=document.createElement('div');e.className='dt';e.style.width=e.style.height=cell+'px';e.innerHTML=iconImg(ic,ic==='fire'?'flick':'');e.style.transition='none';pos(e,c,r);el.appendChild(e);e.offsetWidth;e.style.transition='';tiles[k]={e,c,r,remove(){e.remove()}}},
    move(k,c,r){const t=tiles[k];if(!t)return;t.c=c;t.r=r;pos(t.e,c,r)},
    pop(k){const t=tiles[k];if(!t)return;pos(t.e,t.c,t.r,1.3);setTimeout(()=>{t.e.style.opacity=0;pos(t.e,t.c,t.r,0)},120)},
    set(k,ic){const t=tiles[k];if(t){t.e.innerHTML=iconImg(ic,ic==='fire'?'flick':'');t.e.style.opacity=1;pos(t.e,t.c,t.r,1.25);setTimeout(()=>pos(t.e,t.c,t.r,1),200)}},
    hand(c,r,on){hand.style.opacity=on?1:0;hand.style.transform=`translate(${c*cell+cell*.35}px,${r*cell+cell*.4}px)`},
    boom(c,r,col,sz){const b=document.createElement('div');b.className='boom';const s=sz*cell;Object.assign(b.style,{left:c*cell+cell/2-s/2+'px',top:r*cell+cell/2-s/2+'px',width:s+'px',height:s+'px',background:`radial-gradient(${col}ee,${col}00 70%)`});el.appendChild(b);b.offsetWidth;b.classList.add('go');setTimeout(()=>b.remove(),600)},
    beam(r,col){const b=document.createElement('div');Object.assign(b.style,{position:'absolute',left:0,top:r*cell+cell*.3+'px',height:cell*.4+'px',width:'100%',background:col,borderRadius:'10px',opacity:.9,transition:'opacity .5s',zIndex:4});el.appendChild(b);setTimeout(()=>b.style.opacity=0,200);setTimeout(()=>b.remove(),700)},
    beamV(c,col){const b=document.createElement('div');Object.assign(b.style,{position:'absolute',top:0,left:c*cell+cell*.3+'px',width:cell*.4+'px',height:'100%',background:col,borderRadius:'10px',opacity:.9,transition:'opacity .5s',zIndex:4});el.appendChild(b);setTimeout(()=>b.style.opacity=0,200);setTimeout(()=>b.remove(),700)}};
  return D;
}
async function runDemo(k,host){
  const tok=demoTok,alive=()=>tok===demoTok&&host.isConnected,W=ms=>wait(ms).then(()=>{if(!alive())throw 0});
  const cell=Math.min(58,Math.floor((Math.min(innerWidth,400)-90)/5));
  const fill=(D,grid)=>grid.forEach((row,r)=>row.forEach((ic,c)=>{if(ic)D.put(r+'_'+c,c,r,ic)}));
  const swap=async(D,a,b,ca,ra,cb,rb)=>{D.hand(ca,ra,true);await W(500);D.hand(cb,rb,true);D.move(a,cb,rb);D.move(b,ca,ra);await W(400);D.hand(cb,rb,false)};
  const D=makeDemo(host,5,3,cell);
  try{while(alive()){D.clear();
    if(k==='match'){fill(D,[['g0','g0','g1','g2','g4'],['g3','g4','g0','g2','g1'],['g2','g1','g3','g4','g3']]);await W(600);
      await swap(D,'0_2','1_2',2,0,2,1);await W(150);['0_0','0_1','1_2'].forEach(x=>D.pop(x));sfx.match(0);await W(1200)}
    else if(k==='rocket'){fill(D,[['g0','g0','g1','g0','g4'],['g3','g4','g0','g2','g1'],['g2','g1','g3','g4','g3']]);await W(600);
      await swap(D,'0_2','1_2',2,0,2,1);await W(150);['0_0','0_1','0_3'].forEach(x=>{D.move(x,2,0);D.pop(x)});D.set('1_2','rV0');await W(900);
      D.hand(2,0,true);await W(350);D.hand(2,0,false);await W(150);D.hand(2,0,true);await W(250);D.hand(2,0,false);D.beamV(2,'#fff3a0');['1_2','0_2'].forEach(x=>D.pop(x));D.pop('2_2');D.pop('1_2');await W(1300)}
    else if(k==='bomb'){fill(D,[['g1','g2','g3','g0','g4'],['g1','g0','g4','g3','g2'],['g3','g1','g1','g4','g0']]);await W(600);
      await swap(D,'2_0','1_0',0,2,0,1);await W(150);['0_0','2_0','2_1','2_2'].forEach(x=>{D.move(x,0,2);D.pop(x)});D.set('1_0','b1');D.move('1_0',0,2);await W(900);
      D.hand(0,2,true);await W(300);D.hand(0,2,false);await W(150);D.hand(0,2,true);await W(250);D.hand(0,2,false);D.boom(0,2,'#ffd21e',4);['1_0','0_1','1_1','0_2','1_2','2_3'].forEach(x=>D.pop(x));D.pop('1_0');await W(1300)}
    else if(k==='box'){fill(D,[['g2','g2','g1','box','g4'],['g3','g4','g2','g0','g1'],['g4','box','g3','box','g2']]);await W(600);
      await swap(D,'0_2','1_2',2,0,2,1);await W(150);['0_0','0_1','1_2'].forEach(x=>D.pop(x));D.pop('0_3');D.boom(3,0,'#c98a48',1.6);D.pop('2_1');await W(1300)}
    else if(k==='fire'){fill(D,[['g3','g3','g1','fire','g4'],['g0','g4','g3','g2','g1'],['g4','g1','g0','g2','g0']]);await W(700);
      D.set('0_4','fire');D.boom(4,0,'#ff6a00',1.5);await W(900);
      await swap(D,'0_2','1_2',2,0,2,1);await W(150);['0_0','0_1','1_2'].forEach(x=>D.pop(x));D.boom(3,0,'#9fe8ff',1.8);D.pop('0_3');await W(1400)}
    else if(k==='water'){fill(D,[['fire','g1','fire','g3','g4'],['g0','fire','water','fire','g1'],['g4','g1','fire','g2','g0']]);await W(700);
      D.hand(2,1,true);await W(350);D.hand(2,1,false);await W(150);D.hand(2,1,true);await W(250);D.hand(2,1,false);D.boom(2,1,'#5fd0ff',4.5);
      ['1_2','0_0','0_2','1_1','1_3','2_2'].forEach(x=>D.pop(x));sfx.splash();await W(1500)}
    else{fill(D,[['g0','g1','g2','g3','g4'],['g5','g0','g1','g2','g3'],['g4','g5','g0','g1','g2']]);await W(3000)}
  }}catch(e){}
}

// ---------- map ----------
function unlocked(i){return i===0||!!save.done[i-1]||!!save.done[i]}
function currentLevel(){for(let i=0;i<LEVELS.length;i++)if(!save.done[i])return i;return LEVELS.length}
function openMap(){if(g){g.over=true;g.busy=true}g=null;closeOv();show('map');buildMap()}
function buildMap(){
  const W=innerWidth,H=innerHeight,inner=$('mapInner'),secH=Math.max(340,Math.min(460,W*.95));
  const nodes=[];const topPad=Math.round(($('mapTop').getBoundingClientRect().height||80)+4);let html=`<div class="city" style="top:0;height:${topPad}px;background:linear-gradient(#1f56c4,#56b8ff)"></div>`,y=topPad;
  const totalStars=Object.values(save.done).reduce((a,b)=>a+(+b||0),0);$('mStars').textContent=totalStars+' / '+LEVELS.length*3;
  const cur=currentLevel();let gi=0;
  CITIES.forEach((city,ci)=>{const lv=LEVELS.filter(L=>L.city===ci);
    html+=`<div class="city" style="top:${y}px;height:${secH}px"><svg class="land" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">${landSVG(city.id)}</svg>
     <div class="cityLbl">${city.en}<span class="ar">${city.ar}</span><span class="ctry">${COUNTRY[city.c].en} · <span class="ar">${COUNTRY[city.c].ar}</span></span></div></div>`;
    lv.forEach((L,j)=>{const fy=lv.length===1?.62:[.45,.8][j];const xs=[.5,.74,.5,.26];nodes.push({i:L.idx,x:W*xs[gi%4],y:y+secH*fy});gi++});
    y+=secH});
  const endY=y+secH*.5;
  html+=`<div class="city" style="top:${y}px;height:${secH}px;background:linear-gradient(#2a1a6a,#5a2a9a)"><svg class="land" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">${stars(70,11)}</svg>
    <div class="cityLbl" style="background:linear-gradient(#d3a2ff,#7a33d0);color:#fff;box-shadow:0 4px 0 #4f1a92">Endless Mode<span class="ar">بلا نهاية</span><span class="ctry" style="color:#f0e0ff">Harder and harder forever!</span></div></div>`;
  y+=secH;
  const pts=nodes.concat([{x:W/2,y:endY}]);let d=`M${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],my=(a.y+b.y)/2;d+=` C${a.x} ${my} ${b.x} ${my} ${b.x} ${b.y}`}
  html+=`<svg id="mapPath" style="height:${y}px" viewBox="0 0 ${W} ${y}"><path d="${d}" stroke="#0005" stroke-width="20" fill="none" stroke-linecap="round" transform="translate(0 4)"/><path d="${d}" stroke="#fff8dc" stroke-width="16" fill="none" stroke-linecap="round"/><path d="${d}" stroke="#e8b960" stroke-width="5" fill="none" stroke-dasharray="2 14" stroke-linecap="round"/></svg>`;
  nodes.forEach(n=>{const st=save.done[n.i]||0,un=unlocked(n.i),isCur=n.i===cur;
    html+=`<button class="node ${isCur?'cur':un?'':'lock'}" style="left:${n.x}px;top:${n.y}px" data-i="${n.i}">${un?n.i+1:'🔒'}
      ${st?`<span class="nstars">${[0,1,2].map(k=>`<i class="${k<st?'':'off'}">⭐</i>`).join('')}</span>`:''}${isCur?`<span class="nhead">${salahHead()}</span>`:''}</button>`});
  const eun=!!save.done[LEVELS.length-1];
  html+=`<button class="node endless ${eun?'':'lock'}" style="left:${W/2}px;top:${endY}px" id="endNode">${eun?'∞':'🔒'}<span class="nlbl">${eun?`Level ${save.endless.lv} · Best ${save.endless.best}`:'Finish all cities!'}</span>${eun&&cur>=LEVELS.length?`<span class="nhead">${salahHead()}</span>`:''}</button>`;
  inner.style.height=y+'px';inner.innerHTML=html;
  inner.querySelectorAll('.node[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(!unlocked(i)){sfx.bad();toast('🔒 Finish level '+i+' first!');return}sfx.click();start(i)});
  $('endNode').onclick=()=>{if(!eun){sfx.bad();toast('🔒 Finish all '+LEVELS.length+' levels first!');return}sfx.click();startEndless(save.endless.lv||1)};
  const target=cur>=LEVELS.length?endY:nodes[cur].y;requestAnimationFrame(()=>{$('mapScroll').scrollTop=Math.max(0,target-H*.55)});
}
